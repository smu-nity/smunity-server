spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none

management:
  endpoints:
    web:
      exposure:
        include: "info"

  prometheus:
    metrics:
      export:
        enabled: false

  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: false

slack:
  webhook:
    url: ${SLACK_WEBHOOK_URL}
